name: Signify Documentation Pages

on:
  pull_request:
    paths:
      - "docs/pages/**"
      - "scripts/pages-test.cjs"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - "scripts/pages-test.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify documentation links and assets
        run: node scripts/pages-test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/pages
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
