name: Signify Creator CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIGNIFY_LICENSE_PUBLIC_KEY: ${{ vars.SIGNIFY_LICENSE_PUBLIC_KEY }}
      SIGNIFY_LICENSE_AUTHORITY_URL: ${{ vars.SIGNIFY_LICENSE_AUTHORITY_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Release tag must match package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) { console.error('Expected v'+p.version+', received '+process.env.RELEASE_TAG); process.exit(1); }"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@v7
        with:
          name: signify-creator-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  sign-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: signify-creator-${{ github.sha }}
          path: dist
      - name: Sign and verify release inventory
        env:
          SIGNIFY_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.SIGNIFY_RELEASE_SIGNING_PRIVATE_KEY }}
          SIGNIFY_RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.SIGNIFY_RELEASE_SIGNING_PUBLIC_KEY }}
          SIGNIFY_RELEASE_SIGNING_KEY_ID: ${{ vars.SIGNIFY_RELEASE_SIGNING_KEY_ID }}
        run: |
          test -n "$SIGNIFY_RELEASE_SIGNING_PRIVATE_KEY"
          test -n "$SIGNIFY_RELEASE_SIGNING_PUBLIC_KEY"
          test -n "$SIGNIFY_RELEASE_SIGNING_KEY_ID"
          test -f dist/server/license-build.json
          node scripts/sign-release.cjs dist
          node scripts/verify-release-signature.cjs dist
      - uses: actions/upload-artifact@v7
        with:
          name: signify-creator-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: sign-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signify-creator-signed-${{ github.sha }}
          path: dist
      - name: Package immutable release
        run: |
          tar -C dist -czf "signify-creator-${{ github.event.release.tag_name }}.tar.gz" .
          sha256sum "signify-creator-${{ github.event.release.tag_name }}.tar.gz" > "signify-creator-${{ github.event.release.tag_name }}.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: signify-creator-${{ github.event.release.tag_name }}.tar.gz
      - name: Attach verified artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "signify-creator-${{ github.event.release.tag_name }}.tar.gz"
          "signify-creator-${{ github.event.release.tag_name }}.tar.gz.sha256"
          "dist/release-signature.json"
          --clobber

  deploy-staging:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: sign-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.SIGNIFY_HEALTH_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signify-creator-signed-${{ github.sha }}
          path: dist
      - name: Configure verified SSH host
        env:
          SSH_KEY: ${{ secrets.SIGNIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SIGNIFY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/signify_deploy
          chmod 600 ~/.ssh/signify_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy staging artifact
        env:
          SSH_HOST: ${{ secrets.SIGNIFY_SSH_HOST }}
          SSH_USER: ${{ secrets.SIGNIFY_SSH_USER }}
          DEPLOY_ROOT: ${{ secrets.SIGNIFY_DEPLOY_ROOT }}
          DEPLOY_COMMAND: ${{ secrets.SIGNIFY_DEPLOY_COMMAND }}
        run: |
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid SSH host"; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy root"; exit 1; }
          [[ "$DEPLOY_COMMAND" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy command"; exit 1; }
          tar -C dist -czf signify-deploy.tar.gz .
          ssh -i ~/.ssh/signify_deploy "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_ROOT/incoming/${{ github.sha }}/artifact'"
          scp -i ~/.ssh/signify_deploy signify-deploy.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/incoming/${{ github.sha }}/"
          ssh -i ~/.ssh/signify_deploy "$SSH_USER@$SSH_HOST" "tar -xzf '$DEPLOY_ROOT/incoming/${{ github.sha }}/signify-deploy.tar.gz' -C '$DEPLOY_ROOT/incoming/${{ github.sha }}/artifact' && '$DEPLOY_COMMAND' '$DEPLOY_ROOT/incoming/${{ github.sha }}/artifact'"

  deploy-production:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.SIGNIFY_HEALTH_URL }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signify-creator-signed-${{ github.sha }}
          path: dist
      - name: Configure verified SSH host
        env:
          SSH_KEY: ${{ secrets.SIGNIFY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SIGNIFY_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/signify_deploy
          chmod 600 ~/.ssh/signify_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and deploy production artifact
        env:
          SSH_HOST: ${{ secrets.SIGNIFY_SSH_HOST }}
          SSH_USER: ${{ secrets.SIGNIFY_SSH_USER }}
          DEPLOY_ROOT: ${{ secrets.SIGNIFY_DEPLOY_ROOT }}
          DEPLOY_COMMAND: ${{ secrets.SIGNIFY_DEPLOY_COMMAND }}
        run: |
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "Invalid SSH host"; exit 1; }
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid SSH user"; exit 1; }
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy root"; exit 1; }
          [[ "$DEPLOY_COMMAND" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid deploy command"; exit 1; }
          tar -C dist -czf signify-deploy.tar.gz .
          ssh -i ~/.ssh/signify_deploy "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_ROOT/incoming/${{ github.sha }}/artifact'"
          scp -i ~/.ssh/signify_deploy signify-deploy.tar.gz "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/incoming/${{ github.sha }}/"
          ssh -i ~/.ssh/signify_deploy "$SSH_USER@$SSH_HOST" "tar -xzf '$DEPLOY_ROOT/incoming/${{ github.sha }}/signify-deploy.tar.gz' -C '$DEPLOY_ROOT/incoming/${{ github.sha }}/artifact' && '$DEPLOY_COMMAND' '$DEPLOY_ROOT/incoming/${{ github.sha }}/artifact'"
