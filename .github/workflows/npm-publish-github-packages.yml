name: Signify Creator CI

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v7
        with:
          name: signify-creator-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: signify-creator-${{ github.sha }}
          path: dist
      - name: Package immutable release
        run: |
          tar -C dist -czf "signify-creator-${{ github.event.release.tag_name }}.tar.gz" .
          sha256sum "signify-creator-${{ github.event.release.tag_name }}.tar.gz" > "signify-creator-${{ github.event.release.tag_name }}.tar.gz.sha256"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: signify-creator-${{ github.event.release.tag_name }}.tar.gz
      - name: Attach verified artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          "signify-creator-${{ github.event.release.tag_name }}.tar.gz"
          "signify-creator-${{ github.event.release.tag_name }}.tar.gz.sha256"
          --clobber
